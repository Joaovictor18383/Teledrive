name: Importar código-fonte TeleCloud

on:
  push:
    branches: [main]
    paths:
      - "imports/READY"

permissions:
  contents: write
  actions: write

concurrency:
  group: telecloud-source-import
  cancel-in-progress: false

jobs:
  import:
    name: Extrair e organizar o código-fonte
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validar e extrair o código-fonte
        shell: bash
        run: |
          set -euo pipefail
          cat imports/payload/*.b64 | base64 --decode > /tmp/telecloud-source.tar.xz
          python3 - <<'PY'
          import pathlib
          import tarfile

          archive = pathlib.Path("/tmp/telecloud-source.tar.xz")
          root = pathlib.Path(".").resolve()
          allowed_skip = {".git", "node_modules", "target", "dist", "dist-ssr", "gen", ".updater", "__pycache__", ".idea"}
          blocked_suffixes = {".key", ".jks", ".keystore", ".sqlite", ".sqlite3", ".sqlite3-wal", ".sqlite3-shm"}
          count = 0
          with tarfile.open(archive, "r:xz") as tf:
              for member in tf.getmembers():
                  name = member.name.replace("\\", "/")
                  path = pathlib.PurePosixPath(name)
                  parts = tuple(x for x in path.parts if x not in ("", "."))
                  if not parts:
                      continue
                  if path.is_absolute() or any(x == ".." for x in parts):
                      raise SystemExit(f"Caminho inseguro: {name}")
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit(f"Tipo de arquivo não permitido: {name}")
                  if any(x in allowed_skip for x in parts):
                      continue
                  if path.suffix.lower() in blocked_suffixes or path.name == "session.bin" or path.name.endswith(".log"):
                      continue
                  if path.name.startswith(".env") and path.name != ".env.example":
                      continue
                  dest = (root.joinpath(*parts)).resolve()
                  if root not in dest.parents and dest != root:
                      raise SystemExit(f"Destino fora do repositório: {name}")
                  if member.isdir():
                      dest.mkdir(parents=True, exist_ok=True)
                      continue
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  source = tf.extractfile(member)
                  if source is None:
                      raise SystemExit(f"Não foi possível ler: {name}")
                  dest.write_bytes(source.read())
                  count += 1
          if count < 50:
              raise SystemExit(f"Importação incompleta: {count} arquivos")
          print(f"Extraídos {count} arquivos de código e documentação.")
          PY

      - name: Apontar o aplicativo para este repositório
        run: |
          node tools/definir-repositorio.mjs Joaovictor18383/Teledrive
          node tools/definir-repositorio.mjs --check
          node tools/set-version.mjs --check

      - name: Limpar arquivos temporários de importação
        run: |
          rm -rf imports .github/workflows/source-import.yml

      - name: Salvar código organizado no GitHub
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: importar e organizar código-fonte TeleCloud 1.0.0"
          git push origin HEAD:main

      - name: Disparar verificações do projeto
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
